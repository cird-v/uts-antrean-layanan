server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nonaktifkan cache agar perubahan index.html (bind mount) langsung terlihat
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy ke backend lewat Service Name (DNS Docker di network app-net)
    #   /api/queue  ->  http://backend:8000/queue
    location /api/ {
        resolver 127.0.0.11 valid=10s;          # DNS internal Docker
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
