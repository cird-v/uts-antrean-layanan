# Jenkins CI/CD server (+ ngrok opsional) untuk pipeline UTS
#
#   cd jenkins
#   docker compose up -d --build                     # Jenkins saja  -> http://localhost:8080
#   NGROK_AUTHTOKEN=xxxx docker compose --profile tunnel up -d   # + ngrok tunnel
#
name: jenkins-ci

services:
  jenkins:
    build: .
    image: jenkins-docker:lts
    container_name: jenkins
    # root agar bisa memakai /var/run/docker.sock (cukup untuk lingkungan lab/UTS)
    user: root
    restart: unless-stopped
    environment:
      # Diisi dari jenkins/.env (salin dari .env.example, jangan di-commit)
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-}
      - APP_REPO_URL=${APP_REPO_URL:-}
      - JENKINS_HOME=/var/lib/docker/volumes/jenkins-data/_data
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"
    volumes:
      # PENTING: Named volume `jenkins-data` dipasang di path yang SAMA dengan lokasinya
      # di host Docker. Jenkins memanggil Docker Engine host, sehingga bind mount
      # `./frontend` pada docker-compose.yml aplikasi di-resolve di host sebagai
      # <JENKINS_HOME>/workspace/<job>/frontend — folder itu benar-benar ada di host.
      # Named volume juga persisten dan executable (dibutuhkan Git askpass untuk PAT).
      - jenkins-data:/var/lib/docker/volumes/jenkins-data/_data
      - /var/run/docker.sock:/var/run/docker.sock

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: jenkins-ngrok
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "jenkins:8080", "--log", "stdout"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}   # wajib diisi saat profile tunnel
    ports:
      - "4040:4040"   # dashboard ngrok -> lihat URL publik di http://localhost:4040
    depends_on:
      - jenkins

volumes:
  jenkins-data:
    name: jenkins-data
