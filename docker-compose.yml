# Student Service Queue System - Studi Kasus 3
# Jalankan:  docker compose up -d --build
name: queue-system

services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
    image: queue-backend:${IMAGE_TAG:-latest}
    container_name: queue-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATA_DIR=/var/lib/backend_data
    volumes:
      # Named Volume -> data antrean (queue.json) tetap aman walau kontainer dihapus
      - queue-db-data:/var/lib/backend_data
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    image: nginx:1.27-alpine
    container_name: queue-frontend
    restart: unless-stopped
    volumes:
      # Bind Mount -> edit index.html di host, langsung terlihat tanpa rebuild image
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  queue-db-data:
    name: queue-db-data
